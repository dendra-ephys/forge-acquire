[package]
name = "forge-acqd"
version = "0.1.0"
edition = "2021"
description = "Independent Forge acquisition and durable journal data plane"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = []
qualification-harness = []

[dependencies]
forge-protocol-v1 = { path = "../protocol/rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_Services",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }
windows-service = "0.8.1"

[lib]
name = "forge_acqd"
path = "src/lib.rs"

[[bin]]
name = "forge-acqd"
path = "src/main.rs"

[[test]]
name = "gui_kill_qualification"
path = "tests/gui_kill_qualification.rs"
required-features = ["qualification-harness"]

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
