[workspace]
name = "forge-host-app"
version = "0.1.0"
description = "Forge Acquire desktop host application"
channels = ["conda-forge"]
platforms = ["win-64"]

[dependencies]
nodejs = ">=22,<23"
rust = ">=1.82,<2"

[feature.nwb.dependencies]
python = "3.11.*"
rust = ">=1.82,<2"
numpy = ">=2,<3"
h5py = "==3.16.0"
hdf5 = "==2.1.0"
pynwb = "==4.1.0"

[feature.nwb.pypi-dependencies]
nwbinspector = "==0.7.2"

[feature.nwb.tasks]
probe-nwb = { cmd = "python -m forge_workers.materializer probe", env = { PYTHONPATH = "workers/python;protocol/python" } }
test-nwb = { cmd = "python -m unittest discover -s workers/tests_nwb -v", env = { PYTHONPATH = "workers/python;protocol/python;workers/tests" } }

[environments]
nwb = { features = ["nwb"], no-default-feature = true }

[tasks]
install = "npm install"
dev = "npm run dev"
test = "npm run test"
build = "npm run build"
check-bundle = "npm run check:bundle"
check = "npm run check"
check-tauri = "cargo check --manifest-path src-tauri/Cargo.toml"
check-all = { depends-on = ["check", "check-tauri"] }
test-protocol = "npm run test:protocol"
test-data-plane = "npm run test:data-plane"
test-workers = "npm run test:workers"
self-check-data-plane = "cargo run --manifest-path recording-daemon/Cargo.toml -- --self-check"
visual-qa = "npm run visual:qa"
desktop = "npm run tauri dev"
