[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-worker-foundation"
version = "0.1.0"
description = "M0/M1-bound Forge worker adapters and fail-closed NWB materializer boundary"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=2.0,<3",
]

[project.optional-dependencies]
# These ranges document the integration family only. A production deployment
# must freeze exact resolved versions and their hashes before preflight passes.
nwb = [
  "h5py>=3.11,<4",
  "pynwb>=3.1,<5",
  "nwbinspector>=0.6,<1",
]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
